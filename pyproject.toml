[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-edge-rl"
version = "0.1.0"
description = "RL-first UAV edge intelligence simulation framework built on GrADyS-style discrete-event simulation."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "reinforcement-learning",
    "multi-agent",
    "uav",
    "edge-computing",
    "discrete-event-simulation",
    "gymnasium",
    "rllib",
    "pettingzoo",
    "agilerl",
]
authors = [
    { name = "Pengfei Wu" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
gym = [
    "gymnasium",
    "numpy",
]
marl = [
    "gymnasium",
    "numpy",
    "pettingzoo",
]
rllib = [
    "gymnasium==1.1.1",
    "numpy<2",
    "ray[rllib]",
    "torch",
]
agilerl = [
    "agilerl>=2.7.1; python_version >= '3.11'",
    "gymnasium>=1.0.0; python_version >= '3.11'",
    "numpy>=2.0.0,<3.0; python_version >= '3.11'",
    "pettingzoo>=1.23.1; python_version >= '3.11'",
]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
]

[tool.setuptools.packages.find]
include = ["aeroedge_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
